<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16192a">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="icon" href="assets/icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:0}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>도쿄 가족여행 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+JP:wght@500;700&display=swap">
<style>
/* Layout: 한 손 조작 모바일 앱 — 상단 고정 헤더 + 하단 탭바, 본문은 시간표(타임테이블) 레일 */
:root{
  --bg:#f3f4f7; --surface:#ffffff; --sunk:#e8eaf0; --ink:#16192a; --muted:#5b6074; --line:#d6d9e3;
  --accent:#6b4fd0;            /* 한조몬선 보라: 숙소↔스카이트리 노선 */
  --accent-soft:#ece8fb; --warn:#b45309; --warn-soft:#fdf1e2; --ok:#0f7a4f; --ok-soft:#e2f4ec; --now:#d9363e;
  --f-body:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-jp:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f111a; --surface:#181b27; --sunk:#222636; --ink:#eceef5; --muted:#a2a7ba; --line:#2e3346;
  --accent:#a48ff0; --accent-soft:#2a2547; --warn:#f0a956; --warn-soft:#3a2a17; --ok:#4fd39a; --ok-soft:#14342a; --now:#ff6b70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f111a; --surface:#181b27; --sunk:#222636; --ink:#eceef5; --muted:#a2a7ba; --line:#2e3346;
  --accent:#a48ff0; --accent-soft:#2a2547; --warn:#f0a956; --warn-soft:#3a2a17; --ok:#4fd39a; --ok-soft:#14342a; --now:#ff6b70; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.jp{font-family:var(--f-jp)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.3}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.hd{display:flex;align-items:center;gap:12px;padding-block:10px}
.hd h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.hd small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.dday{margin-left:auto;font-family:var(--f-mono);font-size:12px;font-weight:600;padding:4px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.daytabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:0 10px}
.daytabs button{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:6px 4px;line-height:1.25;font-size:12px;color:var(--muted)}
.daytabs button b{display:block;font-size:14px;color:var(--ink)}
.daytabs button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.daytabs button[aria-pressed="true"] b{color:var(--bg)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;font-size:13px;color:var(--muted)}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

main{padding-block:16px calc(88px + env(safe-area-inset-bottom,0px))}
section+section{margin-top:22px}
.sec-t{font-size:13px;font-weight:600;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;text-transform:uppercase}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
nav.tabs svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* day hero */
.dayhero{display:grid;gap:8px}
.dayhero .theme{font-size:12px;font-weight:600;color:var(--accent);letter-spacing:.04em}
.dayhero h2{font-size:22px;font-weight:700}
.dayhero p{margin:0;color:var(--muted);font-size:14px}
.wx{display:inline-flex;gap:6px;align-items:center;font-size:13px;background:var(--sunk);border-radius:8px;padding:4px 10px;width:fit-content}
.route{display:flex;flex-wrap:wrap;gap:4px 0;align-items:center;font-size:12.5px;color:var(--muted)}
.route span:not(:last-child)::after{content:"→";margin:0 6px;color:var(--line)}

/* timeline */
.tl{position:relative;display:grid;gap:12px;margin-top:4px}
.tl::before{content:"";position:absolute;left:21px;top:8px;bottom:8px;width:4px;border-radius:2px;background:var(--accent);opacity:.25}
.stop{position:relative;padding-left:52px;min-width:0}
.stop .dot{position:absolute;left:13px;top:16px;width:20px;height:20px;border-radius:50%;background:var(--surface);border:4px solid var(--accent)}
.stop.now .dot{border-color:var(--now);box-shadow:0 0 0 5px color-mix(in srgb,var(--now) 20%,transparent)}
.stop.past .dot{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.stop.now .card{border-color:var(--now)}
.tm{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.tm .mono{font-weight:600;color:var(--ink)}
.nowtag{font-size:11px;font-weight:700;color:#fff;background:var(--now);border-radius:6px;padding:1px 7px}
.card h3{font-size:17px;font-weight:700;margin-top:4px}
.jpline{display:flex;gap:8px;align-items:flex-start;margin-top:4px;font-size:13px;color:var(--muted)}
.jpline .jp{flex:1;min-width:0}
.ib{flex:none;display:inline-grid;place-items:center;width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--accent);padding:0}
.ib svg{width:16px;height:16px}
.bul{margin:10px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.bul li{position:relative;padding-left:14px;font-size:14.5px}
.bul li::before{content:"";position:absolute;left:2px;top:.7em;width:5px;height:5px;border-radius:50%;background:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.badge{display:inline-flex;align-items:stretch;border-radius:7px;overflow:hidden;font-size:12px;border:1px solid var(--line);max-width:100%}
.badge b{color:#fff;padding:2px 7px;font-weight:600;white-space:nowrap}
.badge span{padding:2px 8px;background:var(--bg);min-width:0}
.tip{margin-top:10px;background:var(--warn-soft);border-radius:10px;padding:10px 12px;font-size:14px}
.tip strong{color:var(--warn);font-size:12px;display:block;letter-spacing:.04em}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:6px 11px;font-size:13px;text-decoration:none;color:var(--ink)}
.btn svg{width:15px;height:15px;color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.pri svg{color:#fff}
.thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.thumbs button{flex:none;border:0;padding:0;background:none;width:92px}
.thumbs img{width:92px;height:64px;object-fit:cover;border-radius:8px;display:block;background:var(--sunk)}
.thumbs small{display:block;font-size:11px;color:var(--muted);line-height:1.3;margin-top:3px;text-align:left;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}

.notes{display:grid;gap:8px}
.note{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.note .k{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.note h4{margin:2px 0 4px;font-size:15px}
.note p{margin:0;font-size:14px;color:var(--muted)}
textarea,input,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:84px;resize:vertical}

/* option cards, spot cards, restaurant cards */
.grid{display:grid;gap:12px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.pc .img{position:relative;display:block;width:100%;border:0;padding:0;background:var(--sunk)}
.pc .img img{display:block;width:100%;aspect-ratio:16/10;object-fit:cover}
.pc .img .cnt{position:absolute;right:8px;bottom:8px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;border-radius:6px;padding:2px 7px}
.pc .bd{padding:12px 14px 14px;display:grid;gap:8px}
.pc .meta{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px}
.pc h3{font-size:16.5px}
.sign{font-family:var(--f-jp);font-size:13px;background:var(--sunk);border-radius:8px;padding:6px 10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0}
ol.steps{margin:0;padding-left:20px;display:grid;gap:5px;font-size:14px}
.pill{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.menu{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.menu li{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13.5px;border-top:1px dashed var(--line);padding-top:6px}
.menu li small{grid-column:1/-1;color:var(--muted);font-size:12.5px}
.twoimg{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.twoimg button{border:0;padding:0;background:var(--sunk)}
.twoimg img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
details>summary{padding:12px 14px;cursor:pointer;font-weight:600;list-style:none;display:flex;align-items:center;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";margin-left:auto;color:var(--muted);font-weight:400;font-size:18px}
details[open]>summary::after{content:"−"}
details>.db{padding:0 14px 14px;display:grid;gap:10px}
.list{display:grid;gap:8px}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 12px;min-width:0}
.row .grow{flex:1;min-width:0}
.row h4{margin:0;font-size:14.5px}
.row p{margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.chk input{width:20px;height:20px;flex:none;margin-top:1px;accent-color:var(--accent)}
.chk.done span{color:var(--muted);text-decoration:line-through}
.chk small{display:block;color:var(--muted);font-size:12px}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.phrase .ko{font-size:15px;font-weight:600}
.phrase .ja{font-family:var(--f-jp);font-size:16px;margin-top:4px}
.phrase .ro{font-size:12.5px;color:var(--muted);font-style:italic}
.line-code{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-family:var(--f-mono);font-size:13px}
.big{font-size:28px;font-weight:700;font-family:var(--f-mono)}
.conv{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.conv .eq{color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.timer{display:flex;align-items:center;gap:12px}
.tag{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:14px;text-align:center;padding:20px}

/* overlays */
.ov{position:fixed;inset:0;z-index:50;background:rgba(8,9,14,.94);display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
.ov .bar{display:flex;align-items:center;gap:8px;padding:10px 12px;color:#fff}
.ov .bar .t{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ov .bar button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:9px;min-width:38px;height:38px;padding:0 10px;font-size:14px}
.ov .stage{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex}
.ov .stage img{margin:auto;display:block;max-width:none}
.ov .alts{display:flex;gap:6px;padding:8px 12px;overflow-x:auto}
.ov .alts button{flex:none;background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:5px 12px;font-size:13px}
.ov .alts button[aria-pressed="true"]{background:#fff;color:#111}
.ov .cap{color:#c9ccd8;font-size:12px;padding:0 14px 10px}
.show{position:fixed;inset:0;z-index:60;background:#fff;color:#111;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));text-align:center}
.show .ja{font-family:var(--f-jp);font-size:clamp(28px,8vw,48px);font-weight:700;line-height:1.35;word-break:keep-all;overflow-wrap:anywhere}
.show .ko{font-size:17px;color:#444}
.show button{align-self:center;background:#111;color:#fff;border:0;border-radius:12px;padding:12px 26px;font-size:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px}
@media (min-width:640px){.grid.two{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:no-preference){.card,.pc{transition:border-color .2s}}
</style>

</head>

<header>
  <div class="wrap">
    <div class="hd">
      <div><h1>도쿄 가족여행</h1><small>2026.11.22(일) – 11.25(수) · 3박 4일</small></div>
      <span class="dday" id="dday"></span>
    </div>
    <div id="subnav"></div>
  </div>
</header>
<main class="wrap" id="view"></main>

or":"#0f766e"},{"id":"jnto","label":"일본관광청 24시간 핫라인 (한국어)","number":"050-3816-2787","desc":"365일 24시간 영어·한국어 여행·병원·분실물 안내","color":"#7c3aed"}],"FIRST_TIME_SURVIVAL_CARDS":{"taxFree2026":{"badge":"2026년 11월 1일 전면 개편","title":"일본 신(新) 면세 환급제 — 밀봉 봉투 폐지 & 공항 사후 환급","steps":["매장에서 결제할 때: 기존처럼 여권 실물을 보여주고 세전 5,000엔 이상 면세 등록을 하지만, 결제 금액은 **소비세(10%) 포함 금액을 그대로 결제**합니다.","빨간 밀봉 봉투 폐지: 소모품(과자·화장품)을 투명 봉투에 밀봉하던 규칙은 폐지되었습니다. 단, **일본 체류 중 개봉·섭취·사용은 여전히 금지**됩니다!","귀국일 나리타 T3 도착 후(가장 중요!): **항공 수하물을 부치기 전에** 출국 로비 면세 확인 단말기(또는 Visit Japan Web)에 여권을 스캔합니다.","초록 화면이면 완료, 빨간 화면이 뜨면 옆 세관 검사대에 미사용 물품·영수증을 확인받은 뒤 등록한 카드/계좌/창구로 세금을 환급받습니다."]},"subwayTraps":[{"title":"1. 개찰구에서 에러가 뜨면 당황하지 말고 「精算機(정산기)」로","desc":"PASMO 잔액이 부족해 개찰구 문이 닫히면, 개찰구 안쪽 노란색/분홍색「乗り越し精算機(정산기)」에 카드를 넣고 부족분만 현금으로 충전하면 바로 나올 수 있습니다."},{"title":"2. 도쿄 에스컬레이터는「왼쪽」에 서고「오른쪽」은 비우기","desc":"한국(우측 서기)과 반대로 도쿄에서는 왼쪽 줄에 서서 탑니다. 아이와 함께 탈 때는 양옆으로 나란히 서지 말고 앞뒤로 한 줄로 서세요."},{"title":"3. 3일차 디즈니씨 갈 때「통근쾌속(通勤快速)」절대 금지","desc":"핫초보리역 JR 게이요선에서 보통(各駅停車)과 쾌속(快速)은 마이하마역에 서지만, 통근쾌속은 마이하마를 그대로 통과합니다."},{"title":"4. 교통카드는 반드시「1인 1장(총 4장)」따로 찍기","desc":"한국처럼 카드 한 장으로 여러 명을 찍고 들어갈 수 없습니다. 가족 4명이 각자 1장씩 손에 쥐고 개찰구를 통과하세요."},{"title":"5. 같은 역 이름이라도 회사가 다르면 입구가 다름","desc":"아키하바라역(JR vs 도쿄메트로 히비야선), 아사쿠사역(도에이 A vs 도쿄메트로 G)처럼 알파벳 노선 기호(Z·A·G·H·JE)와 색상을 보고 개찰구에 들어가야 합니다."}],"dailyTips":[{"title":"전압 100V(110V) 돼지코 어댑터 & 멀티탭","desc":"일본은 11자를 쓰는 100V입니다. 휴대폰·보조배터리·가족 기기를 한꺼번에 충전할 수 있게 110V 변환 어댑터 2~3개와 가벼운 멀티탭을 챙기세요."},{"title":"보조배터리는 절대 위탁 수하물(캐리어) 금지","desc":"인천·나리타 공항 모두 리튬이온 보조배터리는 반드시 기내에 들고 타는 손가방에 넣어야 합니다."},{"title":"휴대용 지퍼백·작은 쓰레기 비닐봉투 필수","desc":"도쿄 거리와 전철역은 쓰레기통이 매우 적습니다. 아이 간식 포장지나 물티슈를 담아 숙소에 버릴 작은 비닐을 챙기면 아주 편합니다."},{"title":"엔화 현금 추가 필요 시 세븐일레븐 ATM (한국어)","desc":"일본 내 모든 세븐일레븐 편의점 세븐뱅크 ATM에서 한국어 화면으로 해외결제 체크카드(트래블월렛·트래블로그 등) 엔화 인출이 24시간 가능합니다."},{"title":"Visit Japan Web 스크린샷 & 현지 인터넷","desc":"공항 입국 QR과 면세 절차 화면은 오프라인에서도 열리도록 미리 캡처해 두고, 나리타 착륙 직후 eSIM/로밍을 켜서 Google 지도와 본 앱을 여세요."}]},"TAXI_EMERGENCY_CARD":{"title":"예약 숙소 (S-페리아 인 니혼바시 하코자키)로 바로 복귀","korean":"기사님, 에스페리아 인 니혼바시 하코자키 (주오구 니혼바시 나카스 4-9 · T-CAT 근처)까지 가주세요.","japanese":"運転手さん、エスペリアイン日本橋箱崎（中央区日本橋中洲4-9・T-CAT近く）までお願いします。","romaji":"Untenshu-san, Esuperia In Nihombashi Hakozaki (Chūō-ku Nihombashi-Nakasu 4-9 / T-CAT chikaku) made onegaishimasu.","tip":"호텔 주소 〒103-0008 東京都中央区日本橋中洲4-9 · ☎ 03-3527-2007. 밤늦게 길을 잃거나 가족이 피곤할 때 이 화면을 택시 기사님께 바로 보여주세요."},"PHOTO_CATEGORIES":["전체","공항·리무진","숙소·체크인","교통카드·전철역","전망대·관광","디즈니씨"],"PHOTO_SPOTS":[{"id":"spot-1-1","order":1,"day":1,"itemId":"d1-2","time":"12:50~14:00","category":"공항·리무진","pointType":"공항 도착","title":"나리타공항 제3터미널(T3) 도착 & 파란 바닥 트랙 안내선","jpSign":"成田空港 第3ターミナル 到着ロビー","whereToFind":"입국심사·수하물 수취 후 도착 게이트를 나오면 보이는 파란색 육상 트랙 바닥선","image":"assets/spots/01-narita-t3.jpg","imageAlt":"나리타공항 제3터미널 실내 파란색 육상 트랙 바닥 안내선 현장 사진","photoNote":"제3터미널의 특징인 파란색(출구/이동)·빨간색 트랙 라인을 따라가면 리무진 매표소와 버스 정류장으로 자연스럽게 이어집니다.","steps":["비행기 하차 후 Visit Japan Web(미리 캡처한 입국 QR 코드)과 여권을 꺼내 입국심사와 세관신고를 통과합니다.","도착 로비로 나오면 1층 리무진버스 티켓 카운터와 편의점·화장실 위치를 바로 확인합니다.","자녀와 함께 이동할 때는 파란 트랙 라인 안쪽을 따라 걸으면 동선이 헷갈리지 않습니다."],"proTip":"인천에서 미리 캡처해 둔 Visit Japan Web QR 스크린샷을 꺼내 두면 공항 와이파이 연결 전에도 빠르게 입국할 수 있습니다.","placeQuery":"成田空港 第3ターミナル","credit":"Wikimedia Commons · CC BY 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Narita_Terminal_3_March_22_2020_5am_-_various_05_26_22_966000.jpeg"},{"id":"spot-1-2","order":2,"day":1,"itemId":"d1-2","time":"14:00~14:15","category":"공항·리무진","pointType":"리무진 매표","title":"공항 리무진버스 티켓 구매 카운터 (T-CAT행 발권)","jpSign":"リムジンバス チケットカウンター (T-CAT 箱崎行き)","whereToFind":"나리타 T3 도착 로비 출구 인근 주황색 「Airport Limousine」 유인 카운터 또는 자동발매기","image":"assets/spots/02-limousine-counter.jpg","imageAlt":"공항 리무진버스(Airport Limousine) 오렌지색 공식 매표 카운터 및 승차장 현장 사진","photoNote":"사진은 도쿄 지역 「Airport Limousine」 공식 오렌지 매표 카운터 예시입니다. 나리타 T3 도착로비에도 동일한 오렌지색 로고의 리무진 매표소·발매기가 있습니다.","steps":["주황색 「Friendly Airport Limousine」 카운터에 줄을 서거나 옆 자동발매기에서 [한국어] 버튼을 누릅니다.","목적지는 반드시 「T-CAT (도쿄 시티 에어터미널 / 箱崎)」로 선택하고, 인원수(성인·어린이)와 14:15 또는 14:25 출발 편을 발권합니다.","승차권에 인쇄된 「승강장 번호(예: 몇 번 버스 정류장)」와 출발 시각을 확인하고 출입문 밖 버스 승강장으로 나갑니다."],"proTip":"일본어가 부담스러우면 컨시어지 회화 카드의 「T-CAT（箱崎）行きのバス、4枚お願いします。」 화면을 직원에게 그대로 보여주세요.","placeQuery":"成田空港 リムジンバス 乗り場","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Limousine_Bus_Shinjuku_Station_West_Bus_Stop_No_23_and_Ticket_counter_2016.jpg"},{"id":"spot-1-3","order":3,"day":1,"itemId":"d1-2","time":"14:15~14:25","category":"공항·리무진","pointType":"버스 탑승","title":"공항 리무진버스 승강장 & 캐리어 수하물 탑승 요령","jpSign":"成田空港 リムジンバス乗り場","whereToFind":"나리타 T3 건물 밖 보도 위, 티켓에 적힌 번호 기둥(폴) 앞 대기 줄","image":"assets/spots/03-limousine-bus.jpg","imageAlt":"나리타공항 리무진버스 정류장에서 주황색 리무진버스에 수하물을 싣는 승객들의 현장 사진","photoNote":"주황색·흰색 배색의 리무진버스와 숫자 번호판(예: 11, 12번) 기둥 앞 대기 모습을 참고하세요.","steps":["승차권에 적힌 번호의 버스 정류장 기둥 앞에 5~10분 전까지 도착해 대기합니다.","직원에게 승차권과 목적지(T-CAT)를 확인받은 뒤 큰 캐리어를 맡기고 「수하물 교환증(번호표)」을 꼭 받아 챙깁니다.","버스에 올라타면 75분가량 편안히 휴식하며 이동합니다(앞쪽 전광판에 다음 정류장 안내가 나옵니다)."],"proTip":"여권·엔화 현금·보조배터리·겉옷 등 귀중품과 외출용 물건은 트렁크에 싣지 말고 작은 가방에 넣어 좌석으로 들고 타세요.","placeQuery":"成田空港 第3ターミナル バス乗り場","credit":"Wikimedia Commons · CC BY-SA 3.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Airport_Limousine_Bus_Narita_Intl._Airport_South_Wing.jpg"},{"id":"spot-1-4","order":4,"day":1,"itemId":"d1-2","time":"15:40~16:00","category":"공항·리무진","pointType":"리무진 하차","title":"공항 리무진 하차 장소 · T-CAT (도쿄 시티 에어터미널)","jpSign":"東京シティエアターミナル (T-CAT · 水天宮前駅直結)","whereToFind":"버스 종착(또는 하차) T-CAT 1층 도착 홈 — 「東京シティエアターミナル」 간판","image":"assets/spots/04-tcat-arrival.jpg","imageAlt":"도쿄 시티 에어터미널(T-CAT) 1층 버스 하차장 및 간판 현장 실물사진","photoNote":"2026년 3월 촬영된 T-CAT 실제 도착·버스전용 구역 전경입니다.","steps":["나리타 출발 약 75분 뒤 리무진버스가 T-CAT 1층 전용 도착 홈에 정차하면 수하물 교환증을 보여주고 캐리어를 찾습니다.","유리 자동문 안쪽으로 들어가면 화장실, 편의점, 2층 식당·카페와 스이텐구마에역(Z10) 지하 연결 통로가 바로 이어집니다.","건물 밖으로 나와 왼쪽으로 돌고 신호등을 건너 우회전한 뒤, 로손(LAWSON) 편의점 앞 골목으로 좌회전하면 도보 약 3분 만에 예약 숙소 **S-페리아 인 니혼바시 하코자키**에 도착합니다."],"proTip":"T-CAT은 1층이 도착·안내, 3층이 귀국일 나리타행 출발 로비입니다. 마지막 날 여기서 다시 버스를 타게 되니 1층 출입구 위치를 눈에 익혀두면 좋습니다.","placeQuery":"東京シティエアターミナル T-CAT","credit":"Wikimedia Commons · CC BY 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Tokyo_City_Air_Terminal_20260321.jpg"},{"id":"spot-1-5","order":5,"day":1,"itemId":"d1-2","time":"16:00~16:40","category":"숙소·체크인","pointType":"예약 숙소 · 체크인","title":"S-페리아 인 니혼바시 하코자키 · 입구 & 체크인 안내","jpSign":"エスペリアイン日本橋箱崎 (S-PERIA INN NIHOMBASHI HAKOZAKI)","whereToFind":"〒103-0008 도쿄도 주오구 니혼바시 나카스 4-9 · T-CAT 도보 약 3분 (신호등 우회전 → 로손(LAWSON) 앞 좌회전 → 우측 검은 외관 건물 · ☎ 03-3527-2007)","image":"assets/spots/05-hotel-entrance.jpg","imageAlt":"S-페리아 인 니혼바시 하코자키(エスペリアイン日本橋箱崎) 실제 입구 간판과 1층 통유리 로비·프런트 사진","photoNote":"실제 예약하신 「S-페리아 인 니혼바시 하코자키」 공식 실물사진입니다. 아래 사진 버튼으로 입구 간판 · 건물 전경 · 1층 로비·프런트 3각도를 모두 확인하실 수 있습니다. (체크인 15:00 / 체크아웃 11:00 · 24시간 프런트)","extraImages":[{"label":"입구 간판","src":"assets/spots/05-hotel-entrance.jpg","alt":"S-페리아 인 니혼바시 하코자키 정면 입구 간판 및 1층 로비"},{"label":"건물 전경","src":"assets/spots/05b-hotel-exterior.jpg","alt":"S-페리아 인 니혼바시 하코자키 세로 LED 간판 건물 외관"},{"label":"1층 로비·프런트","src":"assets/spots/05c-hotel-lobby.jpg","alt":"S-페리아 인 니혼바시 하코자키 1층 정문 자동문 및 프런트 데스크"}],"steps":["T-CAT에서 도보 약 3분 거리의 검은 모던 건물 외벽에 적힌 **「S-PERIA INN NIHOMBASHI HAKOZAKI」** 간판과 1층 통유리 자동문으로 들어갑니다.","1층 24시간 프런트(체크인 15:00~ / 체크아웃 11:00)에서 예약 확인서와 **일행 전원의 여권 실물**을 제시하고 객실 카드키를 받습니다. 엘리베이터 앞 **셀프 어메니티 바**에서 필요한 칫솔·용품을 챙기세요.","객실에서 40분 이상 충분히 휴식한 뒤, 외출 전 5종 세트(**여권 실물·엔화 현금·보조배터리·겉옷·스카이트리 예약 QR**)를 챙겨 스이텐구마에역(Z10 · 도보 약 5분)으로 이동합니다."],"proTip":"호텔 진입 골목 바로 앞 **로손(LAWSON) 편의점**에서 1일차 밤 생수와 아침 간식을 사기에 편리합니다. 4·7층에 24시간 코인 세탁기(객실 TV로 가동 상태 확인 가능)가 있고, 4일차 체크아웃(09:30 출발) 전후 짐 보관도 프런트에 요청할 수 있습니다.","placeQuery":"エスペリアイン日本橋箱崎 東京都中央区日本橋中洲4-9","credit":"S-PERIA INN Nihombashi Hakozaki 공식 홈페이지","sourceUrl":"https://www.s-peria-inn.com/nihombashi/","allowCustomHotelMemo":true},{"id":"spot-1-6","order":6,"day":1,"itemId":"d1-3","time":"16:40~16:55","category":"교통카드·전철역","pointType":"교통카드 구매","title":"스이텐구마에역(Z10) 자동발매기 · 무기명 PASMO 구매법","jpSign":"東京メトロ 券売機 (PASMO 購入 · チャージ)","whereToFind":"스이텐구마에역(Z10) 개찰구 바로 옆 분홍색(다기능) 또는 파란색 자동발매기 줄","image":"assets/spots/06-pasmo-machine.jpg","imageAlt":"도쿄메트로 지하철역 개찰구 옆 교통카드(PASMO) 구매 및 충전 자동발매기 실제 사진","photoNote":"사진은 도쿄메트로 역에 설치된 실제 발매기 모습입니다. 화면 오른쪽 위 「한국어(韓国語)」 버튼이 있어 처음 오셔도 쉽습니다.","steps":["분홍색 또는 파란색 「PASMO / 定期券」 표기가 있는 발매기 앞에 서서 화면 우측 상단의 **[한국어]** 버튼을 터치합니다.","**[PASMO 구입] → [무기명 PASMO]**를 선택하고, 금액에서 **[3,000엔]**(카드 보증금 500엔 + 사용 가능 잔액 2,500엔)을 누른 뒤 엔화 현금을 넣습니다.","가족 인원수만큼 1인 1장을 차례로 발급받고, 개찰구 통과 시에는 파란색/무지개색 **IC 카드 리더기에 가볍게 \"터치(찍고)\"** 들어갑니다."],"proTip":"무기명 PASMO 구매 및 충전은 대부분 **현금(엔화)**만 가능합니다. 1만엔권·5천엔권·1천엔권 지폐를 미리 준비해 가세요. (잔액 부족 시 개찰구 안쪽 「精算機(정산기)」에서도 충전 가능)","placeQuery":"水天宮前駅 東京メトロ","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Nishi-Shinjuku-STA_Ticket.jpg"},{"id":"spot-1-7","order":7,"day":1,"itemId":"d1-3","time":"16:55~17:05","category":"교통카드·전철역","pointType":"탑승 전철역","title":"탑승 전철역 · 스이텐구마에역 (Z10 한조몬선 승강장)","jpSign":"水天宮前駅 (Z10) 2番線 押上(スカイツリー前)方面","whereToFind":"보라색 [Z] 한조몬선 개찰구 통과 후 **2번 승강장 (Z14 押上·오시아게 방면)**","image":"assets/spots/07-suitengumae-station.jpg","imageAlt":"스이텐구마에역 Z10 한조몬선 승강장 기둥 표지판(2번선 오시아게 방면 / 1번선 시부야 방면) 실제 사진","photoNote":"기둥 왼쪽의 「2번선 Z10 → Z14 押上(スカイツリー前)」 방향과 오른쪽 「1번선 시부야 방면(귀가 시 탑승)」을 한눈에 확인할 수 있습니다.","steps":["스이텐구마에역 개찰구로 들어가 보라색 **[Z] 한조몬선** 안내를 따라 승강장으로 내려갑니다.","기둥에 **「2番線 · 押上(スカイツリー前)方面」**이라고 적힌 쪽에서 열차를 기다립니다(행선지: 押上·久喜·南栗橋 모두 스카이트리에 정차!).","환승 없이 딱 4정거장(기요스미시라카와 → 스미요시 → 긴시초 → 오시아게), 약 10분이면 도착합니다."],"proTip":"밤에 숙소로 돌아올 때는 같은 노선 반대편 **「1번선 渋谷(시부야) 방면」**을 타면 그대로 스이텐구마에역으로 돌아옵니다.","placeQuery":"水天宮前駅","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Suitengumae-STA_Platform1-2.jpg"},{"id":"spot-1-8","order":8,"day":1,"itemId":"d1-3","time":"17:05~17:10","category":"교통카드·전철역","pointType":"하차 전철역","title":"하차 전철역 · 오시아게역 (Z14 스카이트리타운 연결 입구)","jpSign":"押上〈スカイツリー前〉駅 (Z14) 東京スカイツリータウン連絡口","whereToFind":"한조몬선 하차 후 개찰구를 나와 「東京スカイツリータウン(도쿄 스카이트리 타운)」 유리 자동문 입구","image":"assets/spots/08-oshiage-station.jpg","imageAlt":"오시아게역에서 도쿄 스카이트리 타운(소라마치)으로 바로 연결되는 지하 출입구 실제 사진","steps":["오시아게역(Z14) 승강장에서 내려 에스컬레이터를 타고 올라가 개찰구에 PASMO를 찍고 나옵니다.","바깥 도로로 나가지 말고 천장 표지판의 **「東京スカイツリータウン(Tokyo Skytree Town)」** 방향을 따라가면 사진 속 유리 자동문을 통해 바로 소라마치 지하와 연결됩니다.","내부 에스컬레이터를 타고 4층 이스트야드(East Yard) 캐릭터 매장 층으로 곧장 올라갑니다."],"proTip":"오시아게역에는 분홍색 아사쿠사선·게이세이선 출구도 섞여 있으니, 복귀 시에는 반드시 **보라색 [Z] 한조몬선(半蔵門線 · 渋谷 방면)** 표지를 찾아 들어가세요.","placeQuery":"押上駅 東京スカイツリータウン","credit":"Wikimedia Commons · CC BY-SA 3.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Oshiage_Station,_Skytree_Town_entrance.jpg"},{"id":"spot-1-9","order":9,"day":1,"itemId":"d1-4","time":"17:10~18:15","category":"전망대·관광","pointType":"쇼핑 구역","title":"도쿄 소라마치 이스트야드 4층 캐릭터 매장 & 면세 쇼핑","jpSign":"東京ソラマチ イーストヤード 4F (キャラクターショップ · 免税)","whereToFind":"소라마치 동쪽 구역(イーストヤード) 4층 — 포켓몬센터·지브리(도토리공화국)·점프샵·산리오 밀집 구역","image":"assets/spots/09-solamachi-shops.jpg","imageAlt":"도쿄 소라마치 이스트야드 내 인기 캐릭터 매장(점프샵) 실제 입구 사진","steps":["4층 도착 후 바닥과 기둥의 「East Yard(이스트야드)」 표지를 보고 미리 정한 2~3개 캐릭터 매장 위주로 둘러봅니다.","한 매장에서 세전 5,000엔(세후 5,500엔) 이상 구매 시 계산대에서 **여권 실물**을 꺼내 「멘제이 데키마스카?(면세 되나요?)」라고 요청합니다.","저녁식사와 전망대 입장에 늦지 않도록 **18:15에 쇼핑을 마감**하고 6·7층/30·31층 식당가(대기 30분 초과 시 3층 타베테라스)로 이동합니다."],"proTip":"2026년 11월 신 면세 환급제에 따라 빨간 밀봉 봉투는 폐지되었지만, **일본 출국 전까지 개봉·사용·섭취는 여전히 금지**됩니다. 영수증·물품을 보관해 4일차 나리타공항 단말기에서 여권 스캔 후 환급받으세요.","placeQuery":"東京ソラマチ イーストヤード","credit":"Wikimedia Commons · CC0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Jump_Shop_Tokyo_Solamachi_20250831_124810.jpg"},{"id":"spot-1-10","order":10,"day":1,"itemId":"d1-sky","time":"19:20~19:35","category":"전망대·관광","pointType":"전망대 입구","title":"도쿄 스카이트리 4층 전망대 입구 & QR 입장","jpSign":"東京スカイツリー 4F 入口フロア · チケットカウンター","whereToFind":"소라마치 4층 실내 연결 통로를 따라 이동하면 바로 나오는 스카이트리 타워 4층 입구 로비","image":"assets/spots/10-skytree-4f-entrance.jpg","imageAlt":"도쿄 스카이트리 4층 전망대 매표소 및 입장 대기 로비 실제 현장 사진","photoNote":"입장권은 구매 완료 상태이므로 매표 카운터에 줄 설 필요 없이, 모바일 QR을 준비해 입장 게이트로 바로 가면 됩니다.","steps":["19:15경 소라마치 식당가에서 식사를 마치고, 건물 밖으로 나가지 말고 4층 실내 통로를 따라 「TOKYO SKYTREE 4F Entrance」 표지판을 따라갑니다.","구매해 둔 **모바일 QR 코드** 화면 밝기를 최대로 올린 뒤, 공항식 가방 보안검색과 게이트 QR 스캔을 통과합니다.","시속 600m(약 50초) 고속 셔틀 엘리베이터를 타고 단숨에 지상 350m 「덴보 데크(天望デッキ)」로 올라갑니다."],"proTip":"혹시 1일차 리무진 버스나 식사가 지연되더라도 스카이트리 최종 입장은 **21:00(폐장 22:00)**이므로 침착하게 4층 입구로 이동하시면 됩니다.","placeQuery":"東京スカイツリー 4階 入口","credit":"Wikimedia Commons · CC BY 2.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Ticket_counters_@_Tokyo_Skytree_(9461636103).jpg"},{"id":"spot-1-11","order":11,"day":1,"itemId":"d1-sky","time":"19:35~20:40","category":"전망대·관광","pointType":"전망대 야경","title":"스카이트리 350m/450m 전망대 야경 & 1층 광장 포토존","jpSign":"天望デッキ(350m) · 天望回廊(450m) · タウン広場","whereToFind":"350m 덴보 데크(340m 유리바닥 포함) → 선택 450m 덴보 회랑 → 5층 출구 하산 → 1층 타운 광장","image":"assets/spots/11-skytree-night-view.jpg","imageAlt":"도쿄 스카이트리 덴보 데크 전망대에서 내려다본 스미다강과 도쿄 도심 야경 실물사진","steps":["350m 덴보 데크에서 360도 파노라마 야경과 340층 투명 유리 바닥을 감상하며 가족 기념사진을 남깁니다.","체력과 예약권(콤보 티켓) 여유가 있다면 450m 「덴보 회랑(최고 451.2m)」까지 올라가 하늘 산책 경사로를 걸은 뒤 5층 출구로 내려옵니다.","20:25경 1층 스카이트리타운 광장에서 점등된 타워·크리스마스 일루미네이션 배경 가족사진을 찍고, 여력이 있을 때만 도보 10분 짓켄바시를 들른 뒤 오시아게역(Z14)에서 복귀합니다."],"proTip":"새벽 4시부터 이동한 첫날이므로 아이나 부모님이 피곤해하시면 350m 덴보 데크와 1층 광장 사진만 찍고 짓켄바시는 생략해 일찍 숙소로 돌아가는 플랜 B가 가장 현명합니다.","placeQuery":"東京スカイツリー 天望デッキ","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Tokyo_Sky_Tree_tembo_deck_night_view.JPG"},{"id":"spot-2-1","order":12,"day":2,"itemId":"d2-1","time":"08:20~08:45","category":"교통카드·전철역","pointType":"탑승 전철역","title":"탑승 전철역 · 닌교초역 (A14 도에이 아사쿠사선 승강장)","jpSign":"人形町駅 (A14) 都営浅草線 押上·浅草方面","whereToFind":"숙소에서 도보 10분 → 분홍색 [A] 아사쿠사선 승강장 (押上·아사쿠사 방면)","image":"assets/spots/12-ningyocho-station.jpg","imageAlt":"닌교초역 A14 도에이 아사쿠사선 승강장 및 히비야선 H14 안내판 현장 사진","photoNote":"기둥의 분홍색 원형 「A14 人形町」 마크와 아래쪽 「히비야선 H14」 환승 안내가 함께 보이는 실제 승강장입니다.","steps":["공휴일(근로감사의 날) 인파가 몰리기 전 09시 도착을 위해 08:20 숙소를 출발해 닌교초역으로 걸어갑니다.","개찰구에서 PASMO를 찍고 **분홍색 [A] 도에이 아사쿠사선** 「押上·浅草(오시아게·아사쿠사) 방면」 승강장으로 내려갑니다.","열차 행선지가 押上·青砥·京成高砂 등 어느 것이든 아사쿠사역(A18)에 환승 없이 4정거장(약 10분) 만에 도착합니다."],"proTip":"닌교초역은 은색 [H] 히비야선(H14)도 같이 지나가는 환승역입니다. 2일차 밤 귀가와 3일차 아침 디즈니씨 갈 때는 은색 히비야선 방향 표지판을 따라 타게 됩니다.","placeQuery":"人形町駅 都営浅草線","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Toei-subway-A14-Ningyocho-station-platform-20180225-182250.jpg"},{"id":"spot-2-2","order":13,"day":2,"itemId":"d2-1","time":"09:00~12:00","category":"전망대·관광","pointType":"하차역 · 명소","title":"하차역 아사쿠사(A18) A4 출구 → 가미나리몬 & 센소지","jpSign":"浅草駅 (A18) A4出口 · 雷門 · 浅草寺","whereToFind":"아사쿠사역 A18 하차 후 **「雷門(가미나리몬) · A4 출구」** → 도보 2~3분 가미나리몬 대문","image":"assets/spots/13-asakusa-kaminarimon.jpg","imageAlt":"도쿄 아사쿠사 센소지 입구 가미나리몬 대형 붉은 등불 앞 실제 현장 사진","steps":["아사쿠사역(A18)에서 내려 지상의 「雷門(Kaminarimon) · A4 출구」 표지판을 따라 나오면 곧바로 가미나리몬이 나타납니다.","10시 이후엔 사진 찍기 힘들 정도로 붐비므로 09시에 도착하자마자 가미나리몬 대형 등불 앞에서 가족사진을 먼저 찍습니다.","나카미세 상점가에서는 걸으며 먹기(타베아루키)를 삼가고 가게 앞 지정 공간에서만 간식을 맛본 뒤, 대기 줄이 생기기 전 11시에 이른 점심(소바·덴동)을 먹습니다."],"proTip":"공휴일 오전 10시 이후 인파 속에서 아이와 잠시 떨어지더라도 바로 찾을 수 있게 「가미나리몬 큰 등불 앞」을 미리 합류 지점으로 약속해 두세요.","placeQuery":"浅草寺 雷門","credit":"Wikimedia Commons · CC BY-SA 3.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Asakusa_Sensoji_Kaminarimon_2012.JPG"},{"id":"spot-2-3","order":14,"day":2,"itemId":"d2-2","time":"12:00~12:45","category":"전망대·관광","pointType":"포토존 · 탑승역","title":"아즈마바시 포토존 & 아사쿠사역(G19) 긴자선 환승 없는 이동","jpSign":"吾妻橋 · 浅草駅 (G19) 銀座線 渋谷方面","whereToFind":"스미다강변 붉은 아즈마바시(吾妻橋) 입구 → 바로 옆 주황색 [G19] 아사쿠사역 시부야 방면","image":"assets/spots/14-azumabashi-skytree.jpg","imageAlt":"아즈마바시 방향 스미다강 너머 도쿄 스카이트리와 아사히 황금 오브제 전경 사진","photoNote":"낮 시간대(12:00경)에 방문해 전날 밤 전망대·광장에서 본 스카이트리의 낮 풍경과 황금 오브제를 함께 담아 전날 야경 사진을 보완합니다.","steps":["점심 식사 후 강 쪽으로 3분만 걸어 아즈마바시 입구에서 스카이트리와 황금 아사히 오브제를 한 프레임에 넣고 낮 가족사진을 찍습니다.","12:20 다리 옆 주황색 **[G] 도쿄메트로 긴자선 아사쿠사역(G19)**으로 내려가 「渋谷(시부야) 방면」 열차에 탑승합니다(종점 출발이라 방향 헷갈릴 일 없음).","환승 없이 5정거장 뒤 **스에히로초역(G14)**에 내려 주오도리를 따라 남쪽으로 도보 5분 걸으면 아키하바라에 12:45 도착합니다."],"proTip":"아키하바라역이 아니라 긴자선 스에히로초역(G14)에서 내리면 환승 없이 직통으로 오고, 북쪽(애니메이트)에서 남쪽(라디오회관)으로 내리막 동선이 됩니다.","placeQuery":"吾妻橋 浅草","credit":"Wikimedia Commons · CC BY 2.1 jp","sourceUrl":"https://commons.wikimedia.org/wiki/File:Azumabashi_Tokyo_Skytree_20150402.jpg"},{"id":"spot-2-4","order":15,"day":2,"itemId":"d2-3","time":"12:45~16:15","category":"전망대·관광","pointType":"하차역 · 쇼핑","title":"스에히로초역(G14) 하차 → 아키하바라 라디오회관 & 주오도리","jpSign":"秋葉原 ラジオ会館 · 中央通り · アニメイト","whereToFind":"스에히로초역(G14) 남쪽 주오도리(中央通り) → 애니메이트 · 전기상가 · JR역 앞 노란 「라디오회관」","image":"assets/spots/15-akihabara-radio.jpg","imageAlt":"아키하바라 랜드마크 라디오회관 노란 간판과 전기상가 빌딩 거리 실물사진","steps":["스에히로초역 하차 후 큰길(주오도리)을 따라 남쪽으로 걸으며 애니메이트·전자상가·피규어 매장을 3시간 30분 동안 여유롭게 둘러봅니다.","매장 층수가 높고 통신이 느릴 수 있으므로, 부모님과 자녀가 따로 볼 때는 **「합류 시각 + 건물 1층 정문 입구」**를 먼저 못 박아 둡니다.","Tax-Free 마크가 있는 매장(애니메이트·라디오회관 내 입점 샵 등)에서 세전 5,000엔 이상 구매 시 여권 실물로 면세를 받습니다."],"proTip":"자녀가 굿즈를 고르는 동안 부모님은 주오도리 주변 카페에서 다리를 쉬시면 오후 긴자 일정까지 체력을 아낄 수 있습니다.","placeQuery":"秋葉原ラジオ会館","credit":"Wikimedia Commons · CC BY-SA 3.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Akihabara_Radio_Kaikan_1st_-01.jpg"},{"id":"spot-2-5","order":16,"day":2,"itemId":"d2-4","time":"16:15~16:30","category":"교통카드·전철역","pointType":"탑승 전철역","title":"탑승 전철역 · 아키하바라역 (H16 도쿄메트로 히비야선)","jpSign":"秋葉原駅 (H16) 日比谷線 中目黒方面","whereToFind":"JR 아키하바라역 쇼와도리 방면 **은색 [H] 도쿄메트로 히비야선** 개찰구 (中目黒 방면)","image":"assets/spots/16-akihabara-hibiya.jpg","imageAlt":"도쿄메트로 히비야선 아키하바라역 승강장 역명판과 전자상가 모자이크 벽화 실제 사진","photoNote":"역 벽면의 레트로 전자제품 모자이크가 인상적인 히비야선 아키하바라역 승강장 사진입니다(사진 속 H15는 역 번호 개정 전 구 표기이며 현재 역 번호는 H16입니다).","steps":["16:15 라디오회관에서 동쪽 쇼와도리(昭和通り) 방향 지하철 입구로 내려가 **은색 [H] 히비야선** 개찰구를 통과합니다.","승강장에서 **「中目黒(나카메구로) 방면」** 열차를 타면 환승 없이 7정거장, 약 13분 만에 긴자역(H09)에 도착합니다.","JR 야마노테선과 입구가 다르므로, 역 밖에서 노란색/은색 **「東京メトロ 日比谷線」** 표지판을 보고 들어가세요."],"proTip":"히비야선은 2일차 밤 긴자에서 닌교초(H14)로 돌아갈 때도, 3일차 아침 디즈니씨 갈 때도 타게 되는 주력 노선입니다.","placeQuery":"秋葉原駅 日比谷線","credit":"Wikimedia Commons · CC BY 2.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Akihabara_station_sign_on_Hibiya_line.jpg"},{"id":"spot-2-6","order":17,"day":2,"itemId":"d2-4","time":"16:30~19:30","category":"전망대·관광","pointType":"하차역 · 야경","title":"하차역 긴자(H09) 보행자천국 & 와코 시계탑 야경","jpSign":"銀座駅 (H09) 銀座四丁目交差点 · 和光時計塔","whereToFind":"긴자역(H09) 「銀座四丁目交差点」 출구 → 긴자 미쓰코시 건너편 와코 시계탑","image":"assets/spots/17-ginza-wako-night.jpg","imageAlt":"긴자 4초메 교차로 조명이 켜진 와코 시계탑 야경 실물사진","steps":["16:30경 긴자역(H09)에 내리면 공휴일 17:00까지 차가 통제되는 **주오도리 보행자천국(호코텐)** 도로 한가운데를 여유롭게 걸어봅니다.","17:30 긴자 4초메 주변에서 저녁을 먹되, 대기가 30분을 넘으면 백화점(미쓰코시·마쓰야·GINZA SIX) 식당가로 즉시 전환합니다.","18:50 대각선 건너편(미쓰코시 쪽 코너)에서 불 켜진 **와코 시계탑** 전체가 나오도록 야경 가족사진을 찍은 뒤, 19:30 히비야선(北千住 방면)으로 닌교초역(H14)에 복귀합니다."],"proTip":"디즈니씨 전날이므로 마루노우치 일루미네이션은 생략하고 20시경 숙소에 돌아와 3일차 아침거리·PASMO 잔액·티켓을 점검한 뒤 푹 쉬세요.","placeQuery":"銀座 和光","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Ginza-WAKO_at_night.jpg"},{"id":"spot-3-1","order":18,"day":3,"itemId":"d3-1","time":"07:25~07:35","category":"교통카드·전철역","pointType":"환승 전철역","title":"환승 전철역 · 핫초보리역 (H12 히비야선 → JR 게이요선 JE02)","jpSign":"八丁堀駅 (H12 → JR 京葉線 JE02 舞浜方面)","whereToFind":"닌교초역(H14) 7호차 4번 문 근처 탑승 → 핫초보리역(H12) 「桜川公園方面改札」 → 지하 3층 JR 게이요선 1번 승강장","image":"assets/spots/18-hatchobori-keiyo.jpg","imageAlt":"핫초보리역 JR 게이요선(JE/JM) 붉은 노선 마크 개찰구 입구 실제 현장 사진","steps":["07:10 숙소 출발 → 닌교초역(H14)에서 히비야선 「中目黒 방면」 **7호차 4번 문 근처**에 타면 핫초보리역 환승 통로가 바로 앞입니다.","히비야선 「桜川公園方面改札」 개찰구를 PASMO로 나와 통로 끝 **녹색 JR 개찰구(사진)**에 다시 PASMO를 찍고 들어가 지하 3층으로 내려갑니다.","1번 승강장(蘇我·舞浜 방면)에서 **쾌속(快速) 또는 각역정차**를 타세요(**「通勤快速(통근쾌속)」은 마이하마역 무정차 통과**이므로 절대 탑승 금지!)."],"proTip":"종점 도쿄역에서 게이요선으로 갈아타면 긴 지하 통로를 10분 이상 걸어야 하지만, 핫초보리역 환승은 약 5분 만에 깔끔하게 끝납니다.","placeQuery":"八丁堀駅 JR京葉線","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:JR_Keiyo-Line_Hatchobori_Station_Gates.jpg"},{"id":"spot-3-2","order":19,"day":3,"itemId":"d3-1","time":"07:50~08:05","category":"교통카드·전철역","pointType":"하차·모노레일","title":"마이하마역 남쪽 개찰구 & 디즈니 리조트라인 모노레일 환승","jpSign":"舞浜駅 南口 · ディズニーリゾートライン (300円)","whereToFind":"JR 마이하마역(JE07) 남쪽 개찰구 나와 왼쪽 「Resort Gateway Station」 모노레일 입구","image":"assets/spots/19-maihama-resortline.jpg","imageAlt":"JR 마이하마역 남쪽 개찰구 IC 카드 출구 실제 현장 사진","steps":["핫초보리에서 5정거장(약 15분) 뒤 마이하마역에 내리면 사진 속 **남쪽 개찰구(South Gate)**로 나옵니다(디즈니랜드 방면 북쪽 출구가 아님!).","개찰구를 나와 왼쪽으로 도보 2분 걸으면 디즈니 리조트라인 모노레일 「리조트 게이트웨이 스테이션」이 바로 보입니다.","모노레일 개찰구에서도 표 살 필요 없이 **PASMO(1회 300엔)**를 찍고 들어가 디즈니씨(3번째 역)까지 약 10분간 타고 이동합니다."],"proTip":"모노레일 창밖으로 디즈니랜드와 디즈니 호텔이 펼쳐지며, 손잡이도 미키 마우스 모양이라 아이들이 정말 좋아합니다.","placeQuery":"舞浜駅 南口","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:JRE_Maihama-STA_South-Gate.jpg"},{"id":"spot-3-3","order":20,"day":3,"itemId":"d3-1","time":"08:10~09:00","category":"디즈니씨","pointType":"하차역 · 입장","title":"하차역 · 도쿄디즈니씨 스테이션 & 09:00 개장 대기 게이트","jpSign":"東京ディズニーシー・ステーション · 入園ゲート","whereToFind":"모노레일 3번째 역 「도쿄디즈니씨 스테이션」 개찰구 나와 정면 디즈니씨 플라자 게이트","image":"assets/spots/20-disneysea-station.jpg","imageAlt":"도쿄디즈니씨 스테이션(리조트라인) 개찰구 실제 현장 사진","steps":["리조트 게이트웨이 → 도쿄디즈니랜드 → 베이사이드 다음인 3번째 역 **도쿄디즈니씨 스테이션**에서 내려 PASMO를 찍고 나옵니다.","계단/엘리베이터로 내려가면 바로 앞이 디즈니씨 입장 광장이며, 보안검색 후 북쪽·남쪽 게이트 중 비교적 짧은 줄에 섭니다.","08:15경부터 개장 대기하면서 전날 사 둔 아침 간식을 먹고, 스마트폰 공식 앱에 4명의 입장 QR이 한 그룹으로 잘 묶여 있는지 재확인합니다."],"proTip":"09:00 정각(또는 조기 개장 시) 게이트 QR을 찍고 전원 통과하자마자, 걸으면서 바로 앱으로 **겨울왕국 DPA(1인 2,500엔)**부터 결제하세요!","placeQuery":"東京ディズニーシー・ステーション","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Tokyo-Disne-Sea-STA_Gate.jpg"},{"id":"spot-3-4","order":21,"day":3,"itemId":"d3-2","time":"11:15~13:00","category":"디즈니씨","pointType":"테마파크 핵심","title":"도쿄 디즈니씨 판타지 스프링스 (겨울왕국 DPA · 아렌델)","jpSign":"東京ディズニーシー ファンタジースプリングス (アナと雪の女王)","whereToFind":"파크 가장 안쪽 신규 테마포트 「Fantasy Springs」 — 아렌델 성 & 노스 마운틴 얼음성","image":"assets/spots/21-fantasy-springs.jpg","imageAlt":"도쿄 디즈니씨 판타지 스프링스 프로즌 킹덤(겨울왕국) 실제 전경 사진","steps":["09:05 입구 오른쪽 **소어링(스탠바이)**을 먼저 타고, 10:10 **센터 오브 디 어스** 줄을 서면서 두 번째 **토이 스토리 매니아 DPA**를 추가 구매합니다.","예약 시각(11:15 전후)에 맞춰 아라비안 코스트 옆 통로를 통해 신규 구역 **판타지 스프링스**로 들어갑니다.","유료 DPA로 대기 시간 없이 「애나와 엘사의 프로즌 저니(겨울왕국)」를 탑승하고, 판타지 스프링스 내 라푼젤 또는 피터팬 중 앱 대기시간이 짧은 어트랙션을 함께 즐긴 뒤 13:00 아라비안 코스트에서 모바일 오더로 점심을 먹습니다."],"proTip":"인디아나 존스 어드벤처는 11.29까지 운휴 중입니다. 오후에 시간이 밀리면 니모 → 레이징 스피릿 순으로 과감히 생략하고 **15:30 토이 스토리 매니아 DPA 시각**을 최우선으로 지키세요.","placeQuery":"ファンタジースプリングス 東京ディズニーシー","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Fantasy_Springs_-_Frozen_Kingdom.jpg"},{"id":"spot-3-5","order":22,"day":3,"itemId":"d3-4","time":"18:40~21:45","category":"디즈니씨","pointType":"야간 쇼 · 복귀","title":"메디테러니언 하버 야간 쇼 (빌리브! · 불꽃) & 마감 복귀","jpSign":"メディテレーニアンハーバー · ビリーヴ！","whereToFind":"디즈니씨 중앙 호수 「메디테러니언 하버」 물가 관람석 → 퇴장 후 20:40 리조트라인","image":"assets/spots/22-disneysea-harbor-night.jpg","imageAlt":"도쿄 디즈니씨 메디테러니언 하버 야경과 호텔 미라코스타 전경 실제 사진","steps":["17:15 아메리칸 워터프런트에서 이른 저녁 식사를 마친 뒤, 18:40부터 하버 물가에 돗자리/겉옷을 챙겨 자리를 잡습니다.","19:30 **「빌리브! ~씨 오브 드림스~」**, 20:15 미라코스타 벽면 영상, 20:30 크리스마스 불꽃까지 3연속 야간 쇼를 감상합니다.","20:40 불꽃 종료 직후 인파가 몰리므로 가족이 손을 잡고 이동해 **리조트라인 → 마이하마(JR 게이요선 東京 방면) → 핫초보리(히비야선 北千住 방면) → 21:35 닌교초 도착** 순서로 복귀합니다."],"proTip":"바닷가 하버 밤바람이 아주 차갑습니다! 겉옷과 핫팩을 꼭 챙기고, 숙소에 돌아오자마자 면세품(미사용·영수증 보관)과 캐리어를 미리 싸 두면 마지막 날 아침이 편합니다.","placeQuery":"メディテレーニアンハーバー 東京ディズニーシー","credit":"Wikimedia Commons · CC BY 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Disney_Sea_in_the_Night.JPG"},{"id":"spot-4-1","order":23,"day":4,"itemId":"d4-1","time":"09:30~10:15","category":"공항·리무진","pointType":"귀국 출발","title":"귀국 출발 · T-CAT 3층 나리타공항행 리무진 로비","jpSign":"T-CAT 3F 成田空港行き出発ロビー (1人 3,100円)","whereToFind":"숙소 09:30 체크아웃 → 도보 3분 T-CAT 건물 **3층(나리타공항행 리무진 출발 로비)**","image":"assets/spots/23-tcat-3f-departure.jpg","imageAlt":"T-CAT(도쿄 시티 에어터미널) 내부 공항 리무진 출발 로비 및 탑승 대기 공간 실제 사진","photoNote":"T-CAT 내부 리무진 출발 로비 분위기입니다(1층 하네다행·3층 나리타행으로 층이 나뉘어 있으니 나리타공항 갈 때는 엘리베이터로 3층으로 올라가세요).","steps":["체크아웃 전 남은 PASMO 잔액은 숙소 근처 편의점이나 T-CAT 매점에서 물·간식을 사며 알뜰하게 사용합니다.","09:30 숙소 체크아웃 후 캐리어를 끌고 T-CAT으로 이동해 엘리베이터로 **3층 나리타공항행 리무진 로비**에 올라갑니다.","매표소/발매기에서 **「나리타 제3터미널(T3)」** 행 승차권(1인 3,100엔)을 사고, 큰 짐을 맡긴 뒤 10:00 전후 버스를 타고 약 80분 만에 나리타 T3에 도착합니다."],"proTip":"나리타행 리무진은 **터미널 2 → 터미널 1 → 터미널 3** 순으로 서거나 노선에 따라 순서가 다르므로, 기사님이나 승무원에게 반드시 「다이산 터미널(T3)」임을 알리고 내리세요.","placeQuery":"東京シティエアターミナル","credit":"Wikimedia Commons · CC BY-SA 4.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:3F%E6%88%90%E7%94%B0%E7%A9%BA%E6%B8%AF%E8%A1%8C%E3%81%8D%E5%87%BA%E7%99%BA%E3%83%AD%E3%83%93%E3%83%BC.jpg"},{"id":"spot-4-2","order":24,"day":4,"itemId":"d4-2","time":"11:20~14:00","category":"공항·리무진","pointType":"출국 수속","title":"나리타공항 출국 로비 · 면세 환급 단말기 & 수하물 위탁","jpSign":"成田空港 出国ロビー · 税関 免税確認端末","whereToFind":"나리타 T3 출발 로비 체크인 카운터 부근 **「TAX-FREE / 세관 면세 확인 단말기」** → 체크인 & 출국심사","image":"assets/spots/24-narita-departure.jpg","imageAlt":"나리타 국제공항 출국 로비 체크인 카운터와 캐리어를 끄는 여행객 실제 현장 사진","steps":["**가장 중요한 순서:** 캐리어(위탁 수하물)를 항공사에 부치기 **전**에 먼저 출국 로비 면세 단말기(또는 세관 카운터)에 여권을 스캔해 소비세 환급·확인 절차를 받습니다.","단말기에 초록 화면이 뜨면 통과이며, 빨간 화면이 뜨면 옆 세관 검사대에서 미개봉 면세품 실물과 영수증을 보여주면 바로 처리됩니다.","체크인과 수하물 위탁, 보안검색, 출국심사를 마친 뒤 14:00 나리타 T3를 이륙해 16:30경 인천 T1 도착 → 주차장 정산 후 대전 반석 자택으로 안전 귀가합니다."],"proTip":"액체류(화장품·음료 등)가 들어있는 면세 봉투는 기내 반입이 안 되므로 반드시 위탁 캐리어에 넣되, 단말기 스캔 전 세관 확인이 필요할 때 꺼내기 쉽게 맨 위에 담아두세요.","placeQuery":"成田空港 第3ターミナル 出発","credit":"Wikimedia Commons · CC BY-SA 3.0","sourceUrl":"https://commons.wikimedia.org/wiki/File:Departure_lobby_of_Tokyo_Narita_Airport.JPG"}],"RESTAURANTS":[{"id":"r-1-1","areaId":"solamachi","areaName":"소라마치 · 스카이트리","day":1,"itemId":"d1-5","rank":1,"badge":"대표 1순위 · 홋카이도 회전초밥","name":"회전초밥 토리톤 도쿄 소라마치점","jpName":"回転寿し トリトン 東京ソラマチ店","cuisine":"회전초밥 · 해산물","location":"도쿄 소라마치 이스트야드 6F 소라마치 다이닝 (4F 포켓몬센터에서 에스컬레이터 2층 위)","hours":"11:00 ~ 23:00 (L.O. 22:00 · 연중무휴)","priceRangeJpy":"¥3,000 ~ ¥5,000","avgPriceJpy":3800,"shopImage":"assets/restaurants/r-1-1-shop.jpg","menuImage":"assets/restaurants/r-1-1-menu.jpg","shopImageAlt":"회전초밥 토리톤 도쿄 소라마치점   const tts = () => { try{ const u=new SpeechSynthesisUtterance(text.replace(/[()（）]/g,' ')); u.lang='ja-JP'; u.rate=.9; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){ toast('이 기기에서는 음성을 재생할 수 없습니다'); } };
  if(src){ curAudio=new Audio(src); curAudio.play().catch(tts); } else tts();
}

/* JST 기준 오늘/현재 시각 */
function jstNow(){
  const p = new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  const g = t => p.find(x=>x.type===t).value;
  return { date:`${g('year')}-${g('month')}-${g('day')}`, min: (+g('hour')%24)*60 + +g('minute') };
}
const toMin = s => { const [h,m]=s.split(':').map(Number); return h*60+m; };
function ddayText(){
  const n=jstNow(); const start=new Date(T.startDate+'T00:00:00Z'), today=new Date(n.date+'T00:00:00Z');
  const diff=Math.round((start-today)/864e5);
  if(diff>0) return `D-${diff}`;
  const idx=T.days.findIndex(d=>d.date===n.date);
  return idx>=0 ? `${idx+1}일차 진행 중` : '여행 완료';
}

function waitChart(){
  const C=DATA.DISNEY_WAIT_CURVE, keys=[['frozen','겨울왕국','#2563eb'],['toystory','토이 스토리','#16a34a'],['soaring','소어링','#d97706'],['tower','타워 오브 테러','#9333ea']];
  const W=340,H=190,l=34,r=8,t=10,b=26, max=Math.ceil(Math.max(...C.flatMap(c=>keys.map(k=>c[k[0]]||0)))/30)*30;
  const x=i=>l+i*(W-l-r)/(C.length-1), y=v=>t+(H-t-b)*(1-v/max);
  let g=''; for(let v=0;v<=max;v+=30) g+=`<line x1="${l}" x2="${W-r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l-5}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted)">${v}</text>`;
  C.forEach((c,i)=>{ if(i%2===0||i===C.length-1) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="10" fill="var(--muted)">${c.time}</text>`; });
  const lines=keys.map(([k,,col])=>`<polyline fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" points="${C.map((c,i)=>x(i)+','+y(c[k]||0)).join(' ')}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="시간대별 예상 대기시간(분)">${g}${lines}</svg>
  <div class="meta" style="font-size:12px;display:flex;gap:10px;flex-wrap:wrap">${keys.map(([,n,c])=>`<span><i style="display:inline-block;width:10px;height:3px;background:${c};vertical-align:middle;margin-right:4px"></i>${n}</span>`).join('')}<span class="tag">단위: 분 (예상)</span></div>`;
}

  const tf=DATA.FIRST_TIME_SURVIVAL_CARDS.taxFree2026;
  return `<section><h3 class="sec-t">이번 여행에 타는 노선</h3><div class="list">${DATA.SUBWAY_GUIDE.map(s=>`<div class="row"><span class="line-code" style="background:${esc(s.color)}">${esc(s.code)}</span><div class="grow"><h4>${esc(s.name)}</h4><p class="mono" style="color:var(--ink)">${esc(s.route)}</p><p>${esc(s.usage)}</p><p>${esc(s.tip)}</p></div></div>`).join('')}</div></section>
  <section><h3 class="sec-t">지하철에서 헷갈리는 5가지</h3><div class="list">${DATA.FIRST_TIME_SURVIVAL_CARDS.subwayTraps.map(t=>`<div class="row"><div class="grow"><h4>${esc(t.title)}</h4><p>${md(t.desc)}</p></div></div>`).join('')}</div></section>
  <section><h3 class="sec-t">${esc(tf.badge)}</h3><div class="card"><h3 style="font-size:16px">${esc(tf.title)}</h3><ol class="steps" style="margin-top:8px">${tf.steps.map(s=>`<li>${md(s)}</li>`).join('')}</ol></div></section>`;
}
function tMoney(){
  const rate=store.get('rate',9.3), jpy=store.get('jpy',1000);
  const ex=store.get('exp',null) ?? DATA.DEFAULT_EXPENSES.map(e=>({...e}));
  const total=ex.reduce((a,e)=>a+Number(e.amountJpy||0),0);
  const byDay=[1,2,3,4].map(d=>ex.filter(e=>e.day===d).reduce((a,e)=>a+Number(e.amountJpy||0),0)); const mx=Math.max(...byDay,1);
  const quick=[500,1000,3000,5000,10000];
  return `<section><h3 class="sec-t">엔화 → 원화</h3><div class="card" style="display:grid;gap:10px">
    <div class="conv"><input id="cvJ" type="number" inputmode="decimal" value="${jpy}" aria-label="엔화"><span class="eq">≈</span><div class="big" id="cvK" style="font-size:20px">${Math.round(jpy*rate).toLocaleString('ko-KR')}원</div></div>
    <div class="chips" style="padding:0">${quick.map(q=>`<button data-qj="${q}">${yen(q)}</button>`).join('')}</div>
    <label class="tag" for="cvR">환율 (1엔 = ?원) — 출발 전 은행 고시 환율로 바꿔 두세요</label><input id="cvR" type="number" step="0.01" inputmode="decimal" value="${rate}">
  </div></section>
  <section><h3 class="sec-t">가족 가계부</h3><div class="card" style="display:grid;gap:10px">
    <div style="display:flex;align-items:baseline;gap:8px;flex-wrap:wrap"><span class="big">${yen(total)}</span><span class="tag">≈ ${Math.round(total*rate).toLocaleString('ko-KR')}원</span></div>
    <div style="display:grid;gap:6px">${byDay.map((v,i)=>`<div style="display:grid;grid-template-columns:44px 1fr 74px;gap:8px;align-items:center;font-size:12.5px"><span>${i+1}일차</span><div class="prog"><i style="width:${v/mx*100}%;background:var(--accent)"></i></div><span class="mono" style="text-align:right">${yen(v)}</span></div>`).join('')}</div>
  </div>
  <form id="exAdd" class="card" style="display:grid;gap:8px;margin-top:10px">
    <div style="display:grid;grid-template-columns:90px 1fr;gap:8px"><select id="exDay" aria-label="일차">${[1,2,3,4].map(d=>`<option value="${d}" ${d===S.day+1?'selected':''}>${d}일차</option>`).join('')}</select><input id="exAmt" type="number" inputmode="numeric" placeholder="금액 (엔)" required></div>
    <input id="exTitle" placeholder="내용 (예: 편의점 간식)" required><button class="btn pri" style="justify-content:center">지출 추가</button>
  </form>
  <div class="list" style="margin-top:10px">${ex.map((e,i)=>`<div class="row"><span class="pill">${e.day}일차</span><div class="grow"><h4 style="font-weight:500">${esc(e.title)}</h4></div><span class="mono">${yen(e.amountJpy)}</span><button class="ib" data-exdel="${i}" aria-label="삭제">×</button></div>`).join('')}</div>
  <div class="acts"><button class="btn" data-exreset="1">처음 예산으로 되돌리기</button></div></section>`;
}
function tCheck(){
  const ck=store.get('check',{}), custom=store.get('custom',[]);
  const all=[...T.checklist, ...custom];
  const done=all.filter(c=>ck[c.id]).length;
  const cats=[...new Set(all.map(c=>c.category||'직접 추가'))];
  return `<section><div class="card" style="display:grid;gap:8px"><div style="display:flex;justify-content:space-between"><b>준비 진행률</b><span class="mono">${done}/${all.length}</span></div><div class="prog"><i style="width:${all.length?done/all.length*100:0}%"></i></div></div></section>
  ${cats.map(c=>`<section><h3 class="sec-t">${esc(c)}</h3><div class="list">${all.filter(x=>(x.category||'직접 추가')===c).map(x=>`<label class="chk ${ck[x.id]?'done':''}"><input type="checkbox" data-ck="${esc(x.id)}" ${ck[x.id]?'checked':''}><span>${esc(x.label)}${x.day?`<small>${x.day}일차</small>`:''}</span></label>`).join('')}</div></section>`).join('')}
  <section><form id="ckAdd" style="display:grid;grid-template-columns:1fr auto;gap:8px"><input id="ckTxt" placeholder="우리 가족 준비물 추가" required><button class="btn pri">추가</button></form></section>`;
}
function tMaps(){
  return `<div class="grid two">${DATA.ROUTE_MAPS.map(m=>`<article class="pc"><button class="img" data-map="${m.id}"><img loading="lazy" src="${esc(m.src)}" alt="${esc(m.title)}"><span class="cnt">눌러서 확대</span></button><div class="bd"><div class="meta"><span class="pill">${m.day}일차</span><span>${esc(m.type)}</span></div><h3>${esc(m.title)}</h3><p style="margin:0;font-size:13.5px;color:var(--muted)">${esc(m.subtitle)}</p><ul class="bul">${m.highlights.map(h=>`<li>${esc(h)}</li>`).join('')}</ul></div></article>`).join('')}</div>`;
}
function tDoc(){
  return `<div class="card" style="display:grid;gap:4px;font-size:14px">${T.rawParagraphs.map(p=>{
    if(p.startsWith('■')) return `<h3 style="font-size:16px;margin-top:14px">${esc(p.slice(1).trim())}</h3>`;
    if(p.startsWith('□')) return `<b style="margin-top:8px">${esc(p.slice(1).trim())}</b>`;
    if(p.startsWith('◦')) return `<p style="margin:0;padding-left:12px;color:var(--muted)">${esc(p.slice(1).trim())}</p>`;
    return `<p style="margin:0">${esc(p)}</p>`; }).join('')}<p class="tag" style="margin-top:12px">${esc(T.sourceNotice)}</p></div>`;
}

/* ---------- overlays ---------- */
function closeOv(){ $('#ovroot').innerHTML=''; document.body.style.overflow=''; }
function openViewer(title, imgs, startIdx=0, caption=''){
  let idx=startIdx, z=1;
  const root=$('#ovroot'); document.body.style.overflow='hidden';
  root.innerHTML=`<div class="ov" role="dialog" aria-label="${esc(title)}"><div class="bar"><span class="t">${esc(title)}</span><button id="zOut" aria-label="축소">−</button><button id="zIn" aria-label="확대">+</button><button id="ovX" aria-label="닫기">닫기</button></div>
    ${imgs.length>1?`<div class="alts">${imgs.map((m,i)=>`<button data-alt="${i}" aria-pressed="${i===idx}">${esc(m.label)}</button>`).join('')}</div>`:''}
    <div class="stage" id="stg"><img id="ovImg" alt=""></div>${caption?`<div class="cap">${esc(caption)}</div>`:''}</div>`;
  const img=$('#ovImg'), stg=$('#stg');
  const fit=()=>{ img.style.width = (stg.clientWidth*z)+'px'; };
  const show=()=>{ img.src=imgs[idx].src; img.alt=imgs[idx].alt||''; root.querySelectorAll('[data-alt]').forEach(b=>b.setAttribute('aria-pressed', +b.dataset.alt===idx)); z=1; fit(); };
  $('#zIn').onclick=()=>{ z=Math.min(5,z*1.5); fit(); }; $('#zOut').onclick=()=>{ z=Math.max(1,z/1.5); fit(); };
  $('#ovX').onclick=closeOv;
  root.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{ idx=+b.dataset.alt; show(); });
  img.ondblclick=()=>{ z = z>1?1:2.5; fit(); };
  show();
}
function openShow(ja, ko){
  $('#ovroot').innerHTML=`<div class="show" role="dialog"><div class="ja">${esc(ja)}</div><div class="ko">${esc(ko)}</div><button id="shX">닫기</button></div>`;
  $('#shX').onclick=closeOv;
}
function openSpot(id){
  const s=DATA.PHOTO_SPOTS.find(x=>x.id===id); if(!s) return;
  const imgs = s.extraImages?.length ? s.extraImages : [{label:s.pointType, src:s.image, alt:s.imageAlt}];
  openViewer(s.title, imgs, 0, s.whereToFind);
}
function openMap(id){ const m=DATA.ROUTE_MAPS.find(x=>x.id===+id); openViewer(m.title,[{label:m.type,src:m.src,alt:m.title}],0,m.subtitle+' · 두 번 탭하면 확대'); }

/* ---------- render ---------- */
function render(){
  renderTabs();
  $('#dday').textContent = ddayText();
  let sub='', body='';
  if(S.tab==='sched'){ sub=dayTabs(S.day,'day'); body=viewSched(); }
  else if(S.tab==='photo'){ sub=dayTabs(S.photoDay,'pday'); body=viewPhoto(); }
  else if(S.tab==='food'){ sub=chipRow(DATA.RESTAURANT_AREAS.map(a=>[a.id,a.shortName]),S.area,'area'); body=viewFood(); }
  else if(S.tab==='disney'){ sub=''; body=viewDisney(); }
  else { sub=chipRow(TOOLS,S.tool,'tool'); body=viewTools(); }
  $('#subnav').innerHTML=sub; $('#view').innerHTML=body;
  if(S.tab==='sched'){ const n=document.querySelector('.stop.now'); if(n && !render.scrolled){ render.scrolled=true; setTimeout(()=>n.scrollIntoView({block:'center'}),50);} }
}

document.addEventListener('click', e=>{
  const b=e.target.closest('button,[data-img]'); if(!b) return;
  const d=b.dataset;
  if(d.tab) return go(d.tab);
  if(d.day!=null){ S.day=+d.day; render(); return window.scrollTo(0,0); }
  if(d.pday!=null){ S.photoDay=+d.pday; render(); return window.scrollTo(0,0); }
  if(d.area){ S.area=d.area; render(); return window.scrollTo(0,0); }
  if(d.tool){ S.tool=d.tool; render(); return window.scrollTo(0,0); }
  if(d.goarea){ S.area=d.goarea; return go('food'); }
  if(d.say) return speak(d.say);
  if(d.spot) return openSpot(d.spot);
  if(d.map) return openMap(d.map);
  if(d.img) return openViewer(d.cap||'', [{label:'',src:d.img,alt:d.cap}]);
  if(d.copy) return copy(d.copy);
  if(d.show){ const p=DATA.PHRASE_CARDS.find(x=>x.id===d.show); return openShow(p.japanese,p.korean); }
  if(d.showtaxi){ const t=DATA.TAXI_EMERGENCY_CARD; return openShow(t.japanese,t.korean); }
  if(d.dpa){ store.set('dpa', d.dpa==='start'?Date.now():0); toast(d.dpa==='start'?'60분 타이머 시작':'초기화했습니다'); return render(); }
  if(d.qj){ store.set('jpy',+d.qj); return render(); }
  if(d.exdel!=null){ const ex=store.get('exp',null)??DATA.DEFAULT_EXPENSES.map(x=>({...x})); ex.splice(+d.exdel,1); store.set('exp',ex); return render(); }
  if(d.exreset){ store.set('exp',null); return render(); }
});
document.addEventListener('change', e=>{
  const t=e.target, d=t.dataset;
  if(d.ck){ const ck=store.get('check',{}); ck[d.ck]=t.checked; store.set('check',ck); render(); }
  if(d.dpre){ const ck=store.get('dpre',{}); ck[d.dpre]=t.checked; store.set('dpre',ck); render(); }
});
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.dataset.memo) store.set('memo-'+t.dataset.memo, t.value);
  if(t.id==='cvJ'||t.id==='cvR'){ const j=+$('#cvJ').value||0, r=+$('#cvR').value||0; store.set('jpy',j); store.set('rate',r); $('#cvK').textContent=Math.round(j*r).toLocaleString('ko-KR')+'원'; }
});
document.addEventListener('submit', e=>{
  e.preventDefault();
  if(e.target.id==='exAdd'){ const ex=store.get('exp',null)??DATA.DEFAULT_EXPENSES.map(x=>({...x})); ex.push({id:'u'+Date.now(),day:+$('#exDay').value,title:$('#exTitle').value.trim(),amountJpy:+$('#exAmt').value}); store.set('exp',ex); render(); toast('추가했습니다'); }
  if(e.target.id==='ckAdd'){ const c=store.get('custom',[]); c.push({id:'c'+Date.now(),label:$('#ckTxt').value.trim(),category:'직접 추가'}); store.set('custom',c); render(); }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeOv(); });
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h) && h!==S.tab){ S.tab=h; render(); } });
setInterval(()=>{ const el=$('#dpaLeft'); if(el){ const l=dpaState(); el.textContent=l?fmtLeft(l):'구매 가능'; } }, 1000);
render();
</script>
